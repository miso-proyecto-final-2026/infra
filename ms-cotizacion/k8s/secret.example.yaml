# Ejemplo de Secret para las credenciales de RDS. NO commitear el real.
#
# scripts/setup.sh ya genera este secret automáticamente a partir de
# `terraform output database_url`, así que normalmente no hay que aplicar
# este archivo a mano. Se deja como referencia para debugging manual o para
# entornos donde no se use setup.sh.
apiVersion: v1
kind: Secret
metadata:
  name: solventa-db-secret
  namespace: solventa-staging
type: Opaque
stringData:
  DATABASE_URL: "postgresql://solventa:CHANGE_ME@<rds-endpoint>:5432/solventa"
