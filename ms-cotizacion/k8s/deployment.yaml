apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-cotizacion
  namespace: solventa-staging
  labels:
    app: ms-cotizacion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-cotizacion
  template:
    metadata:
      labels:
        app: ms-cotizacion
    spec:
      containers:
        - name: ms-cotizacion
          # Sustituido por scripts/setup.sh vía envsubst con la URL real de
          # ECR (ver terraform output ecr_repository_urls).
          image: ${MS_COTIZACION_IMAGE}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ms-cotizacion-config
            - secretRef:
                name: solventa-db-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-cotizacion-config
  namespace: solventa-staging
data:
  # ElastiCache es un endpoint gestionado externo al cluster (no un Service
  # de k8s): sustituido por scripts/setup.sh vía envsubst con
  # `terraform output redis_primary_endpoint`.
  REDIS_URL: "redis://${REDIS_ENDPOINT}:6379/0"
  OPEN_FINANCE_URL: "http://mock-open-finance:8000"
  OPEN_FINANCE_TIMEOUT_S: "0.7"
  CACHE_TTL_S: "300"
  STALE_CACHE_TTL_S: "86400"
  CB_FAIL_MAX: "5"
  CB_RESET_TIMEOUT_S: "30"
  OTEL_SERVICE_NAME: "ms-cotizacion"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
