apiVersion: v1
kind: Service
metadata:
  name: ms-perfilamiento
  namespace: solventa-staging
  annotations:
    # NLB en vez de la Classic ELB por defecto: mejor throughput/latencia
    # bajo la carga sostenida de k6 (HA02: hasta 25.000 perf/hora).
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Mismos umbrales relajados que ms-cotizacion (ver docs/hallazgos.md):
    # el NLB corta en seco las conexiones en curso hacia un target que marca
    # "unhealthy" (target_health_state.unhealthy.connection_termination está
    # en true por defecto) y eso aparece como EOF en k6. Aquí hay 2+ réplicas,
    # así que es menos frágil que HA01, pero durante el escalado del HPA los
    # pods nuevos entran y salen del target group y un health check agresivo
    # puede desregistrar targets sanos en pleno scale-up.
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "30"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: "5"
spec:
  selector:
    app: ms-perfilamiento
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer
