apiVersion: v1
kind: Service
metadata:
  name: ms-perfilamiento
  namespace: solventa-staging
  annotations:
    # NLB en vez de la Classic ELB por defecto: mejor throughput/latencia
    # bajo la carga sostenida de k6 (HA02: hasta 25.000 perf/hora).
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: ms-perfilamiento
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer
