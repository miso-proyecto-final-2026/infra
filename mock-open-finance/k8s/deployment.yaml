apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-open-finance
  namespace: solventa-staging
  labels:
    app: mock-open-finance
spec:
  # IMPORTANTE: debe quedarse en 1 réplica. La latencia inyectada se guarda en
  # memoria del proceso (`_config` a nivel de módulo en app/main.py) y
  # `set_mock_latency` la configura con un PUT a través del LoadBalancer, que
  # llega a un solo pod. Con 2+ réplicas, las demás seguirían respondiendo con
  # la latencia por defecto y el escenario quedaría corrupto en silencio.
  replicas: 1
  selector:
    matchLabels:
      app: mock-open-finance
  template:
    metadata:
      labels:
        app: mock-open-finance
    spec:
      containers:
        - name: mock-open-finance
          # Sustituido por scripts/setup.sh vía envsubst con la URL real de
          # ECR (ver terraform output ecr_repository_urls).
          image: ${MOCK_OPEN_FINANCE_IMAGE}
          ports:
            - containerPort: 8000
          resources:
            # Subido respecto del diseño original (100m/250m). A la carga de la
            # corrida de capacidad de HA02 (~200 sol/s para activar el HPA), el
            # mock con 250m de límite se satura antes que ms-perfilamiento y se
            # acabaría midiendo el cuello de botella del stub en vez del del
            # servicio bajo prueba. A las 4 fases del diseño (5,6 sol/s) le
            # sobraba con 250m; esto es holgura para la corrida adicional.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
