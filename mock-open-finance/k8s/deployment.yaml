apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-open-finance
  namespace: solventa-staging
  labels:
    app: mock-open-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-open-finance
  template:
    metadata:
      labels:
        app: mock-open-finance
    spec:
      containers:
        - name: mock-open-finance
          # Sustituido por scripts/setup.sh vía envsubst con la URL real de
          # ECR (ver terraform output ecr_repository_urls).
          image: ${MOCK_OPEN_FINANCE_IMAGE}
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
